<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTEC GAMER | EA FC 26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- STICKY HEADER -->
    <nav id="sticky-header" class="sticky-header">
        <div class="header-left">
            <span class="logo-text">UNINASSAU</span>
            <span class="logo-text jam">JAM LABS</span>
        </div>
        <div class="header-center">
            <span class="logo-fc">COPA EA FC 26</span>
        </div>
        <div class="header-right">
            <!-- Botão reservado -->
        </div>
    </nav>

    <!-- HERO SECTION REFORMULADA -->
    <header class="fc-hero" id="hero-section">
        
        <!-- DESTAQUE DIREITO (Bandeira e Jogador de Corpo Todo) -->
        <div class="spotlight-showcase">
            <div class="flag-wrapper">
                <img src="" id="spotlight-flag" class="spotlight-flag" alt="" onerror="this.style.opacity=0">
                <div class="flag-gradient"></div>
            </div>
            <img src="" id="spotlight-render" class="spotlight-render" alt="" onerror="this.style.opacity=0">
        </div>

        <!-- CONTEÚDO ESQUERDA/CENTRO (Títulos) -->
        <div class="hero-info">
            <h4>ENTEC UNINASSAU 2026</h4>
            <h1>COPA EA FC 26<br>DUPLAS CO-OP</h1>
            <p class="hero-date">UNINASSAU Campina Grande | 24 de Setembro de 2026</p>
            <a href="#" class="btn-fc" id="btn-inscricao">GARANTA SUA VAGA</a>
        </div>

        <!-- CARROSSEL DE CARTAS (Esteira) -->
        <div class="cards-track" id="cards-track">
            <!-- As cartas serão injetadas e animadas pelo JavaScript aqui -->
        </div>

    </header>

    <script src="script.js"></script>
</body>
</html>
